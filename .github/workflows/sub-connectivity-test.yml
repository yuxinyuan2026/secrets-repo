name: Subscription connectivity test

# 触发方式：
#   1) 改这个文件并推送（自动触发，不用去页面上点按钮）
#   2) Actions 页面手动 Run workflow
#
# 结果会写回仓库的 results/latest.md（因为沙箱/CI 日志外网取不到，直接落成文件最稳）

on:
  push:
    paths:
      - '.github/workflows/sub-connectivity-test.yml'
  workflow_dispatch:
    inputs:
      sub_url:
        description: 'Subscription URL to import'
        required: false
        default: 'https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub'
      probe_url:
        description: 'URL used for the delay test'
        required: false
        default: 'https://www.gstatic.com/generate_204'
      test_traffic:
        description: 'Send real traffic through the fastest node'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          set -e
          VER=v1.19.30
          curl -sSL --fail -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/$VER/mihomo-linux-amd64-$VER.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Write config
        env:
          SUB_URL: ${{ github.event.inputs.sub_url || 'https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub' }}
        run: |
          mkdir -p home providers
          cat > config.yaml <<EOF
          mixed-port: 7890
          bind-address: 127.0.0.1
          external-controller: 127.0.0.1:9090
          allow-lan: false
          ipv6: false
          mode: rule
          log-level: warning
          profile:
            store-selected: false
          proxy-providers:
            sub:
              type: http
              url: "$SUB_URL"
              interval: 3600
              path: ./providers/sub.yaml
              proxy: DIRECT
          proxy-groups:
            - name: "TEST"
              type: select
              use: [sub]
          rules:
            - MATCH,TEST
          EOF

      - name: Start core and inspect import
        run: |
          set -e
          ./mihomo -d ./home -f config.yaml > mihomo.log 2>&1 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://127.0.0.1:9090/version && break
            sleep 1
          done
          sleep 5
          echo "### 1) provider 导入情况"
          curl -s http://127.0.0.1:9090/providers/proxies \
            | jq -r '.providers[] | "  \(.name): \(.proxies|length) nodes (vehicleType=\(.vehicleType), updatedAt=\(.updatedAt))"'
          echo "### 2) 节点清单"
          curl -s http://127.0.0.1:9090/providers/proxies/sub \
            | jq -r '.proxies[] | "  \(.type)  \(.name)"'
          echo "### 3) 订阅可解析节点数"
          curl -s http://127.0.0.1:9090/proxies/TEST | jq -r '"  group TEST 成员数: \(.all|length)"'

      - name: Delay test (all nodes)
        env:
          PROBE_URL: ${{ github.event.inputs.probe_url || 'https://www.gstatic.com/generate_204' }}
        run: |
          echo "### 4) 延迟测试 probe=$PROBE_URL (timeout 8000ms)"
          curl -sG "http://127.0.0.1:9090/group/TEST/delay" \
               --data-urlencode "url=$PROBE_URL" --data-urlencode "timeout=8000" > delays.json
          echo "--- 原始返回 ---"; jq . delays.json
          echo "--- 按延迟排序（0 = 超时/不可用）---"
          jq -r 'to_entries | sort_by(.value) | .[] | "  \(.value) ms  \(.key)"' delays.json
          echo "--- 可用率 ---"
          jq -r '"  可用 \([to_entries[] | select(.value>0)] | length) / 总计 \(length)"' delays.json

      - name: Real traffic through fastest node
        if: ${{ github.event.inputs.test_traffic != 'false' }}
        env:
          PROBE_URL: ${{ github.event.inputs.probe_url || 'https://www.gstatic.com/generate_204' }}
        run: |
          BEST=$(jq -r 'to_entries | map(select(.value>0)) | sort_by(.value) | .[0].key // empty' delays.json)
          echo "### 5) 最快节点: ${BEST:-（无可用节点）}"
          if [ -z "$BEST" ]; then echo "没有可用节点，跳过真实流量测试"; exit 0; fi
          PAYLOAD=$(jq -n --arg n "$BEST" '{name:$n}')
          curl -s -o /dev/null -X PUT -H 'Content-Type: application/json' -d "$PAYLOAD" http://127.0.0.1:9090/proxies/TEST
          sleep 1
          echo "--- 直连出口 IP（对照）---"
          DIRECT=$(curl -s --max-time 15 'https://api.ipify.org?format=json' || echo '{"ip":"(失败)"}')
          echo "  $DIRECT"
          echo "--- 走代理出口 IP ---"
          PROXIED=$(curl -s --max-time 20 -x http://127.0.0.1:7890 'https://api.ipify.org?format=json' || echo '{"ip":"(失败)"}')
          echo "  $PROXIED"
          echo "--- 走代理请求目标站点 ---"
          curl -s -o /dev/null -w "  HTTP %{http_code} (总耗时 %{time_total}s)\n" --max-time 20 -x http://127.0.0.1:7890 "$PROBE_URL" || echo "  (失败)"
          echo "DIRECT_IP=$DIRECT" >> $GITHUB_ENV
          echo "PROXIED_IP=$PROXIED" >> $GITHUB_ENV
          echo "BEST_NODE=$BEST" >> $GITHUB_ENV

      - name: Write results back to repo
        if: always()
        run: |
          mkdir -p results
          SUB_URL="${{ github.event.inputs.sub_url || 'https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub' }}"
          {
            echo "# 订阅连通性测试结果"
            echo
            echo "- 运行时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 订阅地址: \`$SUB_URL\`"
            echo "- 内核: $(./mihomo -v 2>&1 | head -1)"
            echo "- 网络: GitHub Actions runner (ubuntu-latest)"
            echo
            echo "## 1) 导入情况"
            echo '```'
            curl -s http://127.0.0.1:9090/providers/proxies 2>/dev/null \
              | jq -r '.providers[] | "\(.name): \(.proxies|length) nodes (vehicleType=\(.vehicleType))"' || echo "(内核已停止)"
            echo '```'
            echo
            echo "## 2) 节点延迟（0 = 超时/不可用）"
            echo '```'
            if [ -f delays.json ]; then
              jq -r 'to_entries | sort_by(.value) | .[] | "\(.value) ms  \(.key)"' delays.json || echo "(延迟数据解析失败)"
              echo "---"
              jq -r '"可用 \(([to_entries[] | select(.value>0)] | length)) / 总计 \(length)"' delays.json || true
            else
              echo "(没有延迟数据)"
            fi
            echo '```'
            echo
            echo "## 3) 真实流量"
            echo '```'
            echo "最快节点: ${BEST_NODE:-无}"
            echo "直连出口  : ${DIRECT_IP:-未测}"
            echo "走代理出口: ${PROXIED_IP:-未测}"
            echo '```'
          } > results/latest.md
          cp results/latest.md "results/run-${GITHUB_RUN_ID}.md"
          cat results/latest.md

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "没有变化，跳过提交"; exit 0; fi
          git commit -m "Update subscription test results (run ${GITHUB_RUN_ID})"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Stop core
        if: always()
        run: |
          echo "### mihomo 日志尾部"; tail -20 mihomo.log 2>/dev/null || true
          pkill -f 'mihomo -d' || true
